version: '3.8'
services:

  postgres:
    image: postgres:15-alpine
    container_name: ns-postgres
    environment:
      POSTGRES_USER: nsuser
      POSTGRES_PASSWORD: nspass
      POSTGRES_DB: notification_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ns-net]

  redis:
    image: redis:7-alpine
    container_name: ns-redis
    ports:
      - "6379:6379"
    networks: [ns-net]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ns-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [ns-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ns-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    networks: [ns-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ns-kafka-ui
    depends_on: [kafka]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks: [ns-net]

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ns-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [ns-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: ns-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [ns-net]

  grafana:
    image: grafana/grafana:latest
    container_name: ns-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks: [ns-net]

networks:
  ns-net:
    driver: bridge

volumes:
  postgres_data:
